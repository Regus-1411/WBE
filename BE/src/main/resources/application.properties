spring.application.name=DROP

# ═══════════════════════════════════════════
# MySQL DataSource
# ═══════════════════════════════════════════
spring.datasource.url=jdbc:mysql://localhost:3306/drop_water_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ═══════════════════════════════════════════
# JPA / Hibernate
# ═══════════════════════════════════════════
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ═══════════════════════════════════════════
# Flyway Migrations
# ═══════════════════════════════════════════
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ═══════════════════════════════════════════
# JWT Configuration
# ═══════════════════════════════════════════
app.jwt.secret=dHJvcF93YXRlcl9iaWxsaW5nX3NlY3JldF9rZXlfMjAyNl92ZXJ5X2xvbmdfYW5kX3NlY3VyZQ==
app.jwt.expiration-ms=86400000

# ═══════════════════════════════════════════
# Server
# ═══════════════════════════════════════════
server.port=8080

# ═══════════════════════════════════════════
# File Upload (for CSV)
# ═══════════════════════════════════════════
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ═══════════════════════════════════════════
# Email Service / SMTP Configuration (Brevo / Cloud SMTP)
# ═══════════════════════════════════════════
spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:your-smtp-username}
spring.mail.password=${MAIL_PASSWORD:your-smtp-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ═══════════════════════════════════════════
# Application Notification Properties
# ═══════════════════════════════════════════
app.mail.enabled=${MAIL_ENABLED:true}
app.mail.from-email=${MAIL_FROM:noreply@dropwater.com}
app.mail.from-name=DROP Water Management
app.mail.app-url=${APP_URL:http://localhost:5173}



